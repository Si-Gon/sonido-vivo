<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonido Vivo - Detalle de novedad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Sonido Vivo</h1>
    </header>
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Sonido Vivo</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" href="carrito.html">Carrito</a></li>
                    <li class="nav-item"><a class="nav-link" href="novedades.html">Novedades</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Iniciar sesión</a></li>
                    <li class="nav-item"><a class="nav-link" href="registro.html">Registrarse</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div id="detalle-novedad"></div>
        <a href="novedades.html" class="btn btn-outline-dark mt-3">Volver a novedades</a>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-4">
        <p class="mb-0">Sonido Vivo &copy; 2026 | contacto@sonidovivo.cl</p>
    </footer>

    <script src="js/novedades.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var id = parseInt(localStorage.getItem('novedadSeleccionada'));
            var contenedor = document.getElementById('detalle-novedad');
            var novedad = novedades.find(function (n) { return n.id === id; });

            if (!novedad) {
                contenedor.innerHTML = '<p>No se encontró la publicación.</p>';
                return;
            }

            contenedor.innerHTML =
                '<img src="' + novedad.imagen + '" class="img-fluid rounded mb-3" alt="' + novedad.titulo + '" style="max-height:350px;object-fit:contain;width:100%"">' +
                '<h2>' + novedad.titulo + '</h2>' +
                '<p class="text-muted">' + novedad.resumen + '</p>' +
                '<p>' + novedad.contenido + '</p>';
        });
    </script>
</body>
</html>
