<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Sonido Vivo</h1>
    </header>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Sonido Vivo</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" href="carrito.html">Carrito</a></li>
                    <li class="nav-item"><a class="nav-link" href="novedades.html">Novedades</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Iniciar sesión</a></li>
                    <li class="nav-item"><a class="nav-link" href="registro.html">Registrarse</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <h2 class="mb-4">Novedades</h2>
        <div class="row" id="lista-novedades"></div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-4">
        <p class="mb-0">Sonido Vivo &copy; 2026 | contacto@sonidovivo.cl</p>
    </footer>

    <script src="js/novedades.js"></script>
    <script>
        function verNovedad(id) {
    localStorage.setItem('novedadSeleccionada', id);
    window.location.href = 'novedad-detalle.html';
    }

        document.addEventListener('DOMContentLoaded', function () {
            var contenedor = document.getElementById('lista-novedades');
            novedades.forEach(function (n) {
            var col = document.createElement('div');
            col.className = 'col-md-6 mb-3';
            col.innerHTML =
            '<div class="card h-100">' +
            '  <img src="' + n.imagen + '" class="card-img-top" alt="' + n.titulo + '">' +
            '  <div class="card-body">' +
            '    <h5 class="card-title">' + n.titulo + '</h5>' +
            '    <p class="card-text">' + n.resumen + '</p>' +
            '    <button class="btn btn-outline-dark btn-sm" onclick="verNovedad(' + n.id + ')">Leer más</button>' +
            '  </div>' +
            '</div>';
        contenedor.appendChild(col);
        });
    });
    </script>
</body>
</html>
