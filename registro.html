<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonido Vivo - Registrarse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Sonido Vivo</h1>
    </header>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Sonido Vivo</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" href="carrito.html">Carrito</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Iniciar sesión</a></li>
                    <li class="nav-item"><a class="nav-link" href="registro.html">Registrarse</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        <section>
            <h2>Registro de usuario</h2>
            <form id="form-registro">
                <label for="run">RUN (sin puntos ni guion)</label>
                <input type="text" id="run" name="run">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre">
                <label for="apellidos">Apellidos</label>
                <input type="text" id="apellidos" name="apellidos">
                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo">
                <label for="region">Región</label>
                <select id="region" name="region"><!-- cargar regiones con JS --></select>
                <option value="">Seleccionar región</option>
                <label for="comuna">Comuna</label>
                <select id="comuna" name="comuna"><!-- actualizar con JS --></select>
                <option value="">Seleccionar comuna</option>
                <label for="direccion">Dirección</label>
                <input type="text" id="direccion" name="direccion">
                <label for="clave">Contraseña</label>
                <input type="password" id="clave" name="clave" minlength="4" required>
                <button type="submit">Registrarse</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Sonido Vivo &copy; 2026 | Contacto: contacto@sonidovivo.cl</p>
    </footer>
    
    <script src="js/auth.js"></script>
    <script src="js/validaciones.js"></script>
    <script src="js/regiones.js"></script>
</body>
</html>
